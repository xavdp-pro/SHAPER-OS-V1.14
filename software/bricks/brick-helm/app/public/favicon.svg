<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shaperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background superellipse -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Outer Hexagon Shield -->
  <path d="M32 11 L49 21 V43 L32 53 L15 43 V21 Z" stroke="url(#shaperGrad)" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Central Shaper Lightning / S Core -->
  <path d="M37 19 L25 31 H39 L27 45" stroke="url(#shaperGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Quantum pulse node -->
  <circle cx="43" cy="21" r="2.5" fill="#38bdf8"/>
</svg>
